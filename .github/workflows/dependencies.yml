{
  "name": "Dependency checks",
  "on": {
    "push": {},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "dependency-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "dependency-gate": {
      "name": "Dependency gate",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "env": {
        "NEXT_TELEMETRY_DISABLED": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version": "1.4.3"
          }
        },
        {
          "name": "Validate the persistent deployment manifest",
          "env": {
            "ONEPIECE_DB_VOLUME": "existing-fixture-volume",
            "NEXT_PUBLIC_URL": "http://127.0.0.1:3000",
            "DB_USER": "postgres",
            "DB_PASSWORD": "fixture",
            "DB_HOST": "db",
            "DB_PORT": "5432",
            "DB_NAME": "onepiece"
          },
          "run": "docker compose config --quiet"
        },
        {
          "name": "Install maintained scraper dependencies",
          "run": "cd scrapers && npm ci && npm test && npm audit --omit=dev --audit-level=high"
        },
        {
          "name": "Reject high severity runtime advisories",
          "run": "cd client && npm ci && npm audit --omit=dev --audit-level=high"
        },
        {
          "name": "Start a disposable PostgreSQL fixture",
          "run": "docker run -d --name dependency-postgres -e POSTGRES_PASSWORD=test-password -e POSTGRES_DB=onepiece -p 5432:5432 postgres:16-bookworm\nfor i in $(seq 1 60); do docker exec dependency-postgres pg_isready -U postgres && break; sleep 2; done"
        },
        {
          "run": "cd client && npm ci && npm run build"
        },
        {
          "name": "Validate GraphQL and rendered data with a fresh database",
          "env": {
            "DATABASE_URL": "postgresql://postgres:test-password@127.0.0.1:5432/onepiece"
          },
          "run": "cd client\nnpm run db:migrate\nnpm run db:seed\ndocker build --pull -t dependency-check .\ndocker run -d --network host --name dependency-check --memory 1g -e DATABASE_URL dependency-check\ntrap 'docker logs dependency-check; docker rm -f dependency-check dependency-postgres' EXIT\ncurl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/ --output /tmp/onepiece.html\ncurl --fail --silent -H 'Content-Type: application/json' --data '{\"query\":\"{ characters(filter:{search: \\\"luffy\\\",limit:2}) { info { count } results { name } } devilFruits(filter:{limit:2}) { results { name } } }\"}' http://127.0.0.1:3000/api/graphql > /tmp/graphql.json\nnode -e \"const x=require('/tmp/graphql.json');if(x.errors||!x.data.characters.results.length||!x.data.devilFruits.results.length)throw Error(JSON.stringify(x))\""
        }
      ]
    },
    "verified-release-receipt": {
      "name": "Verified release receipt",
      "needs": "dependency-gate",
      "if": "(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "${{ github.repository }}",
        "COMMIT": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Record the exact successful default-branch commit",
          "run": "set -eu\ncase \"$COMMIT\" in *[!a-f0-9]*|'') exit 1;; esac\n[ \"${#COMMIT}\" -eq 40 ]\nref=\"homelab-verified-$COMMIT\"\nexisting=$(gh api \"repos/$GH_REPO/git/matching-refs/tags/$ref\" --jq \".[] | select(.ref == \\\"refs/tags/$ref\\\") | .object.sha\")\nif [ \"$existing\" = \"$COMMIT\" ]; then exit 0; fi\n[ -z \"$existing\" ]\ngh api --method POST \"repos/$GH_REPO/git/refs\" -f \"ref=refs/tags/$ref\" -f \"sha=$COMMIT\"\n"
        }
      ]
    }
  }
}
