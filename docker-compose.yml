services:
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-bookworm
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ${DB_NAME} -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
    # Adopt the existing data volume explicitly; never silently create a blank
    # replacement. Fresh installations create one and set this variable first.
    external: true
    name: ${ONEPIECE_DB_VOLUME}
